services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediagenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediagenda}
      POSTGRES_DB: ${POSTGRES_DB:-mediagenda}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mediagenda-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediagenda} -d ${POSTGRES_DB:-mediagenda}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mediagenda:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3101}:3101"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3101
      APP_URL: ${APP_URL:-http://localhost:3101}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mediagenda}:${POSTGRES_PASSWORD:-mediagenda}@db:5432/${POSTGRES_DB:-mediagenda}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no ficheiro .env}
      # Coloque true quando a aplicacao estiver atras de HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: sh -c "npx prisma migrate deploy && node scripts/seed-se-necessario.mjs && node dist/server.js"
    volumes:
      - mediagenda-uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  mediagenda-postgres:
  mediagenda-uploads:
