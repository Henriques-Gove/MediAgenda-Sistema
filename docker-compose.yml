services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mediagenda:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3101}:3101"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3101
      APP_URL: ${APP_URL:-http://localhost:3101}
      DATABASE_URL: file:/app/data/mediagenda.db
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no ficheiro .env}
      # Coloque true quando a aplicação estiver atrás de HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - mediagenda-data:/app/data
      - mediagenda-uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  mediagenda-data:
  mediagenda-uploads:
